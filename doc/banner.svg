<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-labelledby="title desc">
  <title id="title">Jaxtor reinforcement learning components</title>
  <desc id="desc">Five bold technical icons depict a gridworld, parallel environment rollouts, a replay buffer, continuous control, and evaluation returns.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#fbfcfd"] { fill: #161b22; }
      [stroke="#fbfcfd"] { stroke: #161b22; }
      [stroke="#cbd3dc"] { stroke: #3a424c; }
      [stroke="#dbe1e7"] { stroke: #2f3740; }
      [fill="#e2e7ec"] { fill: #242b33; }
      [stroke="#c7cfd8"] { stroke: #48525d; }
      [fill="#9aa4af"] { fill: #414b56; }
      [fill="#aab3bd"] { fill: #53606d; }
      [stroke="#aab3bd"] { stroke: #53606d; }
      [fill="#6f7a87"] { fill: #89939f; }
      [stroke="#6f7a87"] { stroke: #89939f; }
      [fill="#4285F4"] { fill: #8FB6F9; }
      [stroke="#4285F4"] { stroke: #8FB6F9; }
      [fill="#0FA8AD"] { fill: #5CCBCF; }
      [stroke="#0FA8AD"] { stroke: #5CCBCF; }
      [fill="#7B1FA2"] { fill: #B061CE; }
      [stroke="#7B1FA2"] { stroke: #B061CE; }
      [stroke="#b8c1cb"] { stroke: #495460; }
      [fill="#e9edf1"] { fill: #202730; }
      [fill="#e4e8ed"] { fill: #242b33; }
    }
  </style>

  <!-- Gridworld -->
  <g>
    <rect class="card" fill="#fbfcfd" stroke="#cbd3dc" x="0.6" y="0.6" width="224.8" height="238.8" rx="8" stroke-width="1.2"/>
    <g transform="translate(23 30)">
      <g class="grid-capsules" fill="none" stroke="#c7cfd8" stroke-width="1.6" stroke-linecap="round">
        <path d="M30 4V26 M30 34V56 M30 64V86 M30 94V116 M30 124V146 M30 154V176"/>
        <path d="M60 4V26 M60 34V56 M60 64V86 M60 94V116 M60 124V146 M60 154V176"/>
        <path d="M90 4V26 M90 34V56 M90 64V86 M90 94V116 M90 124V146 M90 154V176"/>
        <path d="M120 4V26 M120 34V56 M120 64V86 M120 94V116 M120 124V146 M120 154V176"/>
        <path d="M150 4V26 M150 34V56 M150 64V86 M150 94V116 M150 124V146 M150 154V176"/>
        <path d="M4 30H26 M34 30H56 M64 30H86 M94 30H116 M124 30H146 M154 30H176"/>
        <path d="M4 60H26 M34 60H56 M64 60H86 M94 60H116 M124 60H146 M154 60H176"/>
        <path d="M4 90H26 M34 90H56 M64 90H86 M94 90H116 M124 90H146 M154 90H176"/>
        <path d="M4 120H26 M34 120H56 M64 120H86 M94 120H116 M124 120H146 M154 120H176"/>
        <path d="M4 150H26 M34 150H56 M64 150H86 M94 150H116 M124 150H146 M154 150H176"/>
      </g>
      <g class="blocked" fill="#9aa4af">
        <rect x="60" y="60" width="30" height="30" rx="1"/>
        <rect x="90" y="60" width="30" height="30" rx="1"/>
        <rect x="60" y="90" width="30" height="30" rx="1"/>
        <rect x="120" y="90" width="30" height="30" rx="1"/>
      </g>
      <rect class="world-boundary" x="0" y="0" width="180" height="180" rx="2" fill="none" stroke="#6f7a87" stroke-width="2.6"/>
      <path class="route" fill="none" stroke="#0FA8AD" d="M15 165V15H165" stroke-width="2.6" stroke-dasharray="6 5" stroke-linecap="round"/>
      <circle class="blue-fill" fill="#4285F4" cx="15" cy="165" r="7.5"/>
      <rect class="goal" fill="#7B1FA2" x="159.5" y="9.5" width="11" height="11" rx="1.5" transform="rotate(45 165 15)"/>
    </g>
  </g>

