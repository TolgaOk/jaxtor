        </g>
        <g transform="translate(0 22)">
          <rect class="record" fill="#e9edf1" width="104" height="16" rx="3"/>
          <g class="record-symbol" fill="#6f7a87"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="record-line" stroke="#6f7a87" x1="36" y1="8" x2="53" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 44)">
          <rect class="record" fill="#e9edf1" width="104" height="16" rx="3"/>
          <g class="record-symbol" fill="#6f7a87"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="record-line" stroke="#6f7a87" x1="36" y1="8" x2="60" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 66)">
          <rect class="sample-record" fill="#0FA8AD" width="104" height="16" rx="3"/>
          <g class="sample-symbol" fill="#fbfcfd"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="sample-line" stroke="#fbfcfd" x1="36" y1="8" x2="55" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 88)">
          <rect class="record" fill="#e9edf1" width="104" height="16" rx="3"/>
          <g class="record-symbol" fill="#6f7a87"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="record-line" stroke="#6f7a87" x1="36" y1="8" x2="58" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 110)">
          <rect class="record" fill="#e9edf1" width="104" height="16" rx="3"/>
          <g class="record-symbol" fill="#6f7a87"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="record-line" stroke="#6f7a87" x1="36" y1="8" x2="52" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 132)">
          <rect class="sample-record" fill="#7B1FA2" width="104" height="16" rx="3"/>
          <g class="sample-symbol" fill="#fbfcfd"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="sample-line" stroke="#fbfcfd" x1="36" y1="8" x2="60" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 154)">
          <rect class="record" fill="#e9edf1" width="104" height="16" rx="3"/>
          <g class="record-symbol" fill="#6f7a87"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="record-line" stroke="#6f7a87" x1="36" y1="8" x2="54" y2="8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g transform="translate(0 176)">
          <rect class="record" fill="#e9edf1" width="104" height="16" rx="3"/>
          <g class="record-symbol" fill="#6f7a87"><circle cx="10" cy="8" r="3"/><rect x="19" y="4" width="8" height="8" rx="1.5"/><circle cx="94" cy="8" r="3"/></g>
          <line class="record-line" stroke="#6f7a87" x1="36" y1="8" x2="60" y2="8" stroke-width="2" stroke-linecap="round"/>
