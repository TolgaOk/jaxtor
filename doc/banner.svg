  <!-- Continuous control -->
  <g transform="translate(634)">
    <rect class="card" fill="#fbfcfd" stroke="#cbd3dc" x="0.6" y="0.6" width="224.8" height="238.8" rx="8" stroke-width="1.2"/>
    <g transform="translate(23 30)">
      <line class="axis" stroke="#c7cfd8" x1="0" y1="180" x2="180" y2="180" stroke-width="1.2"/>
      <path class="terrain" fill="none" stroke="#6f7a87" d="M0 128 C20 128 36 143 58 150 C76 156 90 152 106 128 C119 108 132 66 152 46 C161 37 170 32 180 28" stroke-width="2.8" stroke-linecap="round"/>
