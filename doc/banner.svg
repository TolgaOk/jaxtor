          <circle cx="52" cy="18" r="3.2"/><circle cx="87" cy="38" r="3.2"/><circle cx="123" cy="24" r="3.2"/><circle cx="168" cy="29" r="4.5"/>
        </g>
        <circle fill="#fbfcfd" cx="12" cy="31" r="2.6"/>
      </g>
      <g class="rollout-teal">
        <path fill="none" stroke="#0FA8AD" d="M21 90C34 90 38 104 52 104S72 76 87 78S107 101 123 94S148 76 168 84" stroke-width="2.8" stroke-linecap="round"/>
        <g fill="#0FA8AD">
          <rect x="3" y="81" width="18" height="18" rx="4"/>
          <circle cx="52" cy="104" r="3.2"/><circle cx="87" cy="78" r="3.2"/><circle cx="123" cy="94" r="3.2"/><circle cx="168" cy="84" r="4.5"/>
        </g>
        <circle fill="#fbfcfd" cx="12" cy="90" r="2.6"/>
      </g>
      <g class="rollout-purple">
        <path fill="none" stroke="#7B1FA2" d="M21 149C34 149 38 134 52 134S72 160 87 160S107 135 123 141S149 160 168 151" stroke-width="2.8" stroke-linecap="round"/>
        <g fill="#7B1FA2">
          <rect x="3" y="140" width="18" height="18" rx="4"/>
          <circle cx="52" cy="134" r="3.2"/><circle cx="87" cy="160" r="3.2"/><circle cx="123" cy="141" r="3.2"/><circle cx="168" cy="151" r="4.5"/>
        </g>
        <circle fill="#fbfcfd" cx="12" cy="149" r="2.6"/>
      </g>
    </g>
  </g>

