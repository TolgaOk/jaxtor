      <g class="goal-flag">
        <line x1="167" y1="34" x2="167" y2="9" stroke="#4285F4" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M169 10L180 14.5L169 19Z" fill="#4285F4"/>
      </g>
    </g>
  </g>

  <!-- Evaluation returns -->
  <g transform="translate(874)">
    <rect class="card" fill="#fbfcfd" stroke="#cbd3dc" x="0.6" y="0.6" width="224.8" height="238.8" rx="8" stroke-width="1.2"/>
    <g transform="translate(23 30)">
      <path class="axis" fill="none" stroke="#c7cfd8" d="M0 0V180H180" stroke-width="1.2"/>
      <path class="band" fill="#e4e8ed" d="M8 76 C40 70 64 74 94 68 C126 73 150 65 180 70 L180 116 C150 110 126 118 94 112 C64 118 40 110 8 116 Z"/>
      <path class="mean" fill="none" stroke="#7B1FA2" d="M8 94 C38 96 62 90 92 93 C122 90 151 95 180 91" stroke-width="2.7" stroke-linecap="round"/>
      <g class="observation" fill="#6f7a87">
        <circle cx="8" cy="88" r="2.7"/><circle cx="26" cy="96" r="2.7"/><circle cx="44" cy="92" r="2.7"/>
        <circle cx="62" cy="100" r="2.7"/><circle cx="80" cy="86" r="2.7"/><circle cx="98" cy="94" r="2.7"/>
        <circle cx="116" cy="90" r="2.7"/><circle cx="134" cy="98" r="2.7"/><circle cx="152" cy="84" r="2.7"/>
