[project]
name = "jaxtor"
version = "0.2.0"
description = "JAX-based, composable reinforcement learning components to streamline experimentation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TolgaOk", email = "tolgaokk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chex>=0.1.91",
    "jax>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jaxtor"]

[project.optional-dependencies]
env = [
    "distrax>=0.1.7",
    "envpool>=1.2.5",
    "gymnasium[mujoco]>=1.2.3",
    "gymnax>=0.0.9",
    "jaxdp>=0.3.0,<0.4.0",
    "jaxtyping>=0.3.3",
    "mujoco-mjx==3.5.0",
]
example = [
    "gymnasium[mujoco]>=1.2.3",
    "gymnax>=0.0.9",
    "jaxdp>=0.3.0,<0.4.0",
    "equinox>=0.13.4",
    "optax>=0.2.7",
    "rlax>=0.1.8",
    "tyro>=1.0.6",
]

[project.urls]
Repository = "https://github.com/TolgaOk/jaxtor"
Issues = "https://github.com/TolgaOk/jaxtor/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.5",
    "ty>=0.0.58",
]

[tool.ty.src]
exclude = ["dev", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "backend: exercises optional third-party environment adapters",
    "integration: composes multiple Jaxtor components end to end",
    "statistical: marks tests as statistical (verify probabilistic properties)",
]
filterwarnings = [
    # Upstream mujoco-mjx 3.5.0 fluid model (Swimmer) uses the deprecated
    # jax.numpy.clip positional args; nothing we can fix on our side.
    "ignore:Passing arguments 'a', 'a_min' or 'a_max' to jax.numpy.clip is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88

[tool.uv.sources]
jaxdp = { git = "https://github.com/TolgaOk/jaxdp", rev = "v0.3.0" }
